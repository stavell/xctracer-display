[env:feather_sense]
platform = nordicnrf52
board = adafruit_feather_nrf52840_sense
framework = arduino
monitor_speed = 115200
; The core builds with -Ofast, which implies -ffast-math: the compiler assumes NaN never happens and
; folds every isfinite()/isnan() to a constant, so all NaN guards vanish on the device (found 2026-10-15:
; the heading smoother stuck at NaN). Build with -O2 instead; core/types.h refuses finite-math builds.
build_unflags = -Ofast
build_flags = -Isrc -O2
lib_deps =
    adafruit/Adafruit SHARP Memory Display
    adafruit/Adafruit GFX Library
    adafruit/Adafruit LSM6DS
    adafruit/Adafruit LIS3MDL
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit SHT31 Library

[env:feather_sense_diag]
extends = env:feather_sense
build_flags =
    ${env:feather_sense.build_flags}
    -DDIAGNOSTICS
