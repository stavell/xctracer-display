[env:feather_sense]
platform = nordicnrf52
board = adafruit_feather_nrf52840_sense
framework = arduino
monitor_speed = 115200
; The core builds with -Ofast, which implies -ffast-math: the compiler assumes NaN never happens and
; folds every isfinite()/isnan() to a constant, so all NaN guards vanish on the device (found 2026-10-15:
; the heading smoother stuck at NaN). Build with -O2 instead; platform/util/types.h refuses finite-math builds.
build_unflags = -Ofast
build_flags = -Isrc -O2 -fno-math-errno
; One tree, several images: platform/ is in every image, an image adds its main_<name>.cpp and apps/<name>/.
build_src_filter = +<*> -<main_*.cpp> -<apps/> +<main_vario.cpp> +<apps/vario/>
lib_deps =
    adafruit/Adafruit SHARP Memory Display
    adafruit/Adafruit GFX Library
    adafruit/Adafruit LSM6DS
    adafruit/Adafruit LIS3MDL
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit SHT31 Library

[env:feather_sense_diag]
extends = env:feather_sense
build_flags =
    ${env:feather_sense.build_flags}
    -DDIAGNOSTICS

; The box: home screen + vario + Tetris + compass tool + Settings in one image (the flight display itself is the same code).
[env:feather_sense_box]
extends = env:feather_sense
build_flags =
    ${env:feather_sense.build_flags}
    -Wl,--defsym=__StackTop=0x2003f000
    -Wl,--section-start=.retained=0x2003f000
build_src_filter = +<*> -<main_*.cpp> -<apps/> +<main_box.cpp> +<apps/vario/> +<apps/launcher/> +<apps/settings/> +<apps/games/> +<apps/intro/> +<apps/compass3d/> +<apps/compass/> +<apps/pet/>

; The box plus the example apps of docs/PLATFORM.md (Level). Not a shipped image; proves the "add an app" recipe builds.
[env:feather_sense_box_examples]
extends = env:feather_sense_box
build_flags =
    ${env:feather_sense_box.build_flags}
    -DWITH_EXAMPLES
build_src_filter = ${env:feather_sense_box.build_src_filter} +<apps/examples/>
